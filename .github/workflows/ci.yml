name: argus-reviewer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # This repo's own CI checks out our own code — trusted by definition.
      # Without this, push/workflow_dispatch events resolve untrusted
      # (fail-closed) and tests exercising trusted-path lanes skip/fail.
      ARGUS_TRUSTED: '1'
    strategy:
      fail-fast: false
      # npm ci installs devDeps — electron@44 needs node >=22.12, so the dev
      # toolchain floor is 22 (the published package's own >=20.19 floor is
      # unaffected: consumers never install devDependencies).
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
