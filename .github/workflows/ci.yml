name: argus-reviewer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Own-repo pushes/dispatches check out our own code — trusted by
      # definition. Must NOT apply on pull_request: the override beats the
      # event-based fork check, so a fork PR's code would run trusted lanes.
      # On PR events this resolves empty → the trust gate decides per-payload.
      ARGUS_TRUSTED: ${{ github.event_name != 'pull_request' && '1' || '' }}
    strategy:
      fail-fast: false
      # npm ci installs devDeps — electron@44 needs node >=22.12, so the dev
      # toolchain floor is 22 (the published package's own >=20.19 floor is
      # unaffected: consumers never install devDependencies).
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # Committed dist/ is the git-install contract: fail if the build left
      # drift (stale output) or ignored-untracked files (a new src module
      # whose dist output was never `git add -f`'d — .gitignore hides it).
      - run: npm run check:dist
      # action/parity.cjs is generated from src/ — fail on a stale bundle.
      - run: npm run check:parity
      - run: npm test
      # The dashboard is a release surface — render it headless against a
      # seeded manifest so a renderer break can't ship green unit tests.
      - run: npm run smoke:dashboard

  # app/worker is a standalone package (own lockfile, excluded from root
  # lint/tsconfig by design). Its suite imports src/onboarding/ directly, so
  # main-tree changes can break it — run on every PR, not just app/ diffs.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/worker/package-lock.json
      - run: npm --prefix app/worker ci
      - run: npm --prefix app/worker run typecheck
      - run: npm --prefix app/worker test
