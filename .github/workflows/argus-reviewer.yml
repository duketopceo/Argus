name: argus-reviewer PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  review:
    # The published action is trusted code. Do not execute the PR's local
    # action implementation with provider/write credentials on fork PRs.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) &&
      (github.event.action != 'labeled' || github.event.label.name == 'argus-probe')
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
      statuses: write
    env:
      ARGUS_DEBUG: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build consumer package
        run: npm ci && npm run build

      - name: Run published Argus action
        id: review
        uses: duketopceo/Argus/action@v0.2.0
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          cli: node dist/cli.js
          index: 'false'
          run: 'false'
          working-directory: .

      - name: Upload Argus review report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argus-reviewer-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: argus-reviewer-report/
          if-no-files-found: ignore

  action-contract:
    # PR-controlled action code is checked without provider or write secrets.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/unit/action-contract.test.ts --reporter=dot
