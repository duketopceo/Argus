name: argus-reviewer PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  review:
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
      statuses: write
      actions: write
    env:
      ARGUS_DEBUG: '1'
    steps:
      # The probe sandbox masks .git anyway — but don't persist the token
      # into .git/config in the first place.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build argus-reviewer
        run: npm ci && npm run build

      - name: Run argus-reviewer action
        id: review
        uses: ./action
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          cli: node dist/cli.js
          working-directory: .

      - name: Upload argus-reviewer report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argus-reviewer-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: argus-reviewer-report/
          if-no-files-found: ignore
