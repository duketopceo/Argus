name: argus-reviewer PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    # The published action is trusted code. Do not execute the PR's local
    # action implementation with provider/write credentials on fork PRs.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) &&
      (github.event.action != 'labeled' || github.event.label.name == 'argus-probe')
    runs-on: self-hosted
    # Backstop: a hung model request (observed 90+ min on one socket before
    # the client had a timeout) must not pin the lane forever. Healthy runs
    # complete in well under 10 minutes.
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write
      statuses: write
    env:
      ARGUS_DEBUG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Clear trusted CLI path
        shell: bash
        run: rm -rf -- trusted-argus
      - name: Prepare trusted Argus CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: duketopceo/Argus
          # Post-hardening main: carries the 120s OpenRouter request timeout
          # (#101 — a stalled socket pinned this lane 15min under v0.2.0) and
          # the run-bound evidence contract (#102/#107). Re-anchor to the next
          # tag when one is cut.
          ref: 119cacdce427046d1300da7b1eb386bcc4ed52a5
          path: trusted-argus
          persist-credentials: false
      - name: Install trusted CLI dependencies
        id: trusted-cli
        shell: bash
        env:
          TRUSTED_ARGUS_DIR: ${{ github.workspace }}/trusted-argus
        run: |
          npm --prefix "$TRUSTED_ARGUS_DIR" ci --ignore-scripts --no-audit --no-fund
          printf 'cli=%s %s\n' "$(command -v node)" "$TRUSTED_ARGUS_DIR/dist/cli.js" >> "$GITHUB_OUTPUT"

      - name: Run published Argus action
        id: review
        uses: duketopceo/Argus/action@119cacdce427046d1300da7b1eb386bcc4ed52a5
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          # deepseek-v4.1-flash (the pinned default's code_model) stalls on
          # review-sized prompts — verified 2026-10-05: ~43k-token prompts
          # hang past the 120s request timeout with zero output.
          # v4-flash is the bake-off's realtime pick (recall 1.00/precision
          # 0.93, ~$0.0006/8-chunk review) and completes 43k-token prompts
          # in ~2s — better and cheaper than gemini-lite as the dogfood.
          code-model: deepseek/deepseek-v4-flash
          cli: ${{ steps.trusted-cli.outputs.cli }}
          index: 'false'
          run: 'false'
          working-directory: .

      - name: Upload Argus review report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: argus-reviewer-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: argus-reviewer-report/
          if-no-files-found: ignore

  action-contract:
    # PR-controlled action code is checked without provider or write secrets.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/unit/action-contract.test.ts --reporter=dot
