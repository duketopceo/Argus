<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>argus-reviewer</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --fg: #e6edf3; --dim: #8b949e; --cyan: #39c5cf; --green: #3fb950;
    --red: #f85149; --yellow: #d29922; --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    padding: 16px; overflow-y: auto;
  }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 16px; color: var(--cyan); font-weight: 700; }
  h1 .eye { color: var(--purple); }
  #updated { color: var(--dim); font-size: 11px; }
  #err { color: var(--red); font-size: 11px; margin-left: auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; min-width: 0;
  }
  .card.wide { grid-column: 1 / -1; }
  .card h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin-bottom: 10px; font-weight: 600;
  }
  .row { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
  .row .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .m { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .num { color: var(--cyan); }
  .ok { color: var(--green); } .bad { color: var(--red); }
  .warn { color: var(--yellow); } .dim { color: var(--dim); }
  .checks { margin-left: 18px; font-size: 11px; }

  /* Verify workspace — run list + lane matrix + inspector, all
     keyboard-navigable with visible focus (status never color-only). */
  #verify { display: grid; grid-template-columns: 260px 1fr; gap: 12px; }
  .runlist { max-height: 300px; overflow-y: auto; }
  .runrow, .lanerow {
    display: flex; gap: 8px; align-items: baseline;
    padding: 5px 8px; border-radius: 6px; cursor: pointer;
    border: 1px solid transparent;
  }
  .runrow .rid { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .runrow[aria-selected="true"], .lanerow[aria-selected="true"] {
    border-color: var(--cyan); background: #161b22;
  }
  .runrow:focus-visible, .lanerow:focus-visible, button:focus-visible {
    outline: 2px solid var(--cyan); outline-offset: 1px;
  }
  .runrow:hover, .lanerow:hover { border-color: var(--border); }
  .lanes { min-width: 0; }
  .lanerow .lid { color: var(--cyan); width: 58px; }
  .inspector {
    margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px;
    font-size: 12px; min-height: 40px;
  }
  .inspector .k { color: var(--dim); display: inline-block; min-width: 88px; }
  .notice { color: var(--yellow); padding: 4px 0; }
  .stat { color: var(--dim); }
  pre.eval {
    white-space: pre-wrap; word-break: break-word; font-size: 12px;
    color: var(--fg); max-height: 340px; overflow-y: auto;
  }
  #evallog, #livelog { max-height: 220px; overflow-y: auto; font-size: 12px; }
  #livelog .lv { color: var(--purple); }
  .logs-btn { padding: 0 8px; font-size: 11px; }
  button {
    background: var(--panel); border: 1px solid var(--border); color: var(--fg);
    border-radius: 6px; padding: 4px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--cyan); color: var(--cyan); }
  canvas { display: block; }
  .spark-title { font-size: 11px; color: var(--dim); margin: 6px 0 2px; }
  button:disabled { opacity: .5; cursor: not-allowed; border-color: var(--border); color: var(--dim); }
  button.primary { border-color: var(--yellow); color: var(--yellow); }

  /* Spend confirm — evals cost real OpenRouter credit, so "run eval" opens
     this instead of starting. Esc cancels; Cancel has initial focus. */
  dialog#evalconfirm {
    background: var(--panel); color: var(--fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px 18px; width: min(640px, 92vw);
    margin: auto; /* the global margin reset would pin it top-left */
  }
  dialog#evalconfirm::backdrop { background: rgba(1, 4, 9, .7); }
  dialog#evalconfirm h2 { font-size: 14px; margin-bottom: 10px; color: var(--fg); }
  #ecbody { white-space: pre-wrap; font-size: 12px; margin-bottom: 14px; }
  #ecbody .warn { color: var(--yellow); }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<header>
  <h1><span class="eye">◉</span> argus-reviewer</h1>
  <span id="updated"></span>
  <button id="refresh">refresh</button>
  <button id="eval">run eval</button>
  <span id="err"></span>
</header>
<div class="grid">
  <section class="card wide">
    <h2>Verify Runs <span id="wenote" class="dim"></span></h2>
    <div id="verify">
      <div id="veruns" class="runlist" role="listbox" aria-label="verify runs"></div>
      <div class="lanes">
        <div id="velanes" role="listbox" aria-label="lanes"></div>
        <div id="vedetail" class="inspector" aria-live="polite"></div>
      </div>
    </div>
  </section>
  <section class="card"><h2>Pull Requests</h2><div id="prs"></div></section>
  <section class="card"><h2>Workflow Runs</h2><div id="runs"></div></section>
  <section class="card wide"><h2>Latest Eval <span id="evalfile" class="dim"></span></h2><pre class="eval" id="evaldoc"></pre></section>
  <section class="card"><h2>Journal History</h2><div id="jhist"></div><canvas id="spark" width="520" height="60"></canvas></section>
  <section class="card"><h2>Latest Journal <span id="jfile" class="dim"></span></h2><div id="journal"></div></section>
  <section class="card wide" id="evalcard" hidden><h2>Eval Log</h2><div id="evallog"></div></section>
  <section class="card wide"><h2>Live Log <span class="dim">— argus debug output, tailed live</span></h2><div id="livelog"></div></section>
</div>
<dialog id="evalconfirm" aria-labelledby="ectitle" aria-describedby="ecbody">
  <h2 id="ectitle">Run eval?</h2>
  <div id="ecbody" aria-live="polite"></div>
  <div class="actions">
    <button id="eccancel" type="button" autofocus>Cancel</button>
    <button id="ecrun" type="button" class="primary" disabled>Run eval</button>
  </div>
</dialog>
<script src="renderer.js"></script>
</body>
</html>
