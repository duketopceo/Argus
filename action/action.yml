name: argus-reviewer
description: Run the argus-reviewer harness and post a sticky PR comment with cost and evidence.
author: duketopceo
branding:
  icon: eye
  color: blue
inputs:
  openrouter-api-key:
    description: OpenRouter API key (BYOK). All vision calls are billed through this key.
    required: true
  argus-version:
    description: Optional pinned argus-reviewer-e2e npm version. Empty installs the CLI package from this action ref with lifecycle scripts disabled.
    default: ''
    required: false
  cli:
    description: Optional executable plus arguments for a trusted local CLI override. Shell operators are rejected; empty installs the CLI package from this action ref.
    default: ''
    required: false
  config:
    description: Path to the argus-reviewer config file
    default: argus-reviewer.config.ts
    required: false
  working-directory:
    description: Working directory for the consumer's project
    required: false
  budget-usd:
    description: Optional per-run budget cap override in USD
    required: false
  index:
    description: Run `argus-reviewer index` before the test run to enable diff-aware cache invalidation
    default: 'true'
    required: false
  diff-base:
    description: Base ref for diff invalidation (e.g. origin/main); empty = working tree
    default: ''
    required: false
  node-version:
    description: Node.js version for the harness (Node 20 is deprecated on GH runners)
    default: '22'
    required: false
  browser:
    description: Playwright browser engine to install and run (chromium, firefox, or webkit). Should match config.browser.
    default: 'chromium'
    required: false
  report-dir:
    description: Report output dir, passed to both run and code-review so the post step can find artifacts
    default: argus-reviewer-report
    required: false
  sandbox:
    description: Enable the B.2 probe lane: authored test probes for unexercised findings run in a hardened Docker container (no network, no secrets, read-only fs). Enable-only: 'false' does not override a config-enabled lane. Requires Docker on the runner; forced off on pull_request_target.
    default: 'false'
    required: false
  max-comments:
    description: Cap on inline review comments posted per run; overflow is summarized in the sticky. Overrides review.maxComments when set.
    default: ''
    required: false
  code-model:
    description: Optional OpenRouter model slug for code review (e.g. openai/gpt-5-mini). Wins over the checkout's config code_model, including on pull_request events, where PR config never executes.
    default: ''
    required: false
  review-profiles:
    description: Optional comma-separated review lenses appended to the review prompt: security, perf, debloat (e.g. 'security,perf'). Wins over the checkout's config review.profiles.
    default: ''
    required: false
  install-consumer-dependencies:
    description: Explicitly install the consumer project's dependencies for a trusted runtime lane. Disabled by default so code review never runs PR-controlled lifecycle scripts beside secrets.
    default: 'false'
    required: false
  run:
    description: Run the browser-flow lane (`argus-reviewer run`). Disabled by default for public code-review-only repositories. Requires an explicit target and a trusted runtime path.
    default: 'false'
    required: false
  app:
    description: >-
      Enable the application task lane (`verify --app`): a directed task
      plus an expected-state check against your running app, never free
      exploration. Requires `app-task`; `app-url` wins over the config's
      target.url. Executable lane: refused on fork PRs and
      pull_request_target by the runtime-lane gate.
    default: 'false'
    required: false
  app-task:
    description: Directed task for the app lane (and the a0 lane), e.g. 'submit the signup form and land on /welcome'. Required when app is true.
    default: ''
    required: false
  app-url:
    description: URL the flow/app/a0 lanes target; wins over the config's target.url. Passed as --url.
    default: ''
    required: false
  app-expect-text:
    description: Text that must appear for the app task to pass (maps to --expect-text).
    default: ''
    required: false
  app-expect-url:
    description: Regular expression the page URL must match after the task (maps to --expect-url).
    default: ''
    required: false
  app-expect-selector:
    description: CSS selector that must be present after the task (maps to --expect-selector).
    default: ''
    required: false
  a0:
    description: >-
      Opt-in Agent Zero escalation lane (`verify --a0`): delegates the
      configured task to your self-hosted A0 host inside a sanitized,
      allowlisted child environment. The lane reports `inconclusive` even
      on agent-reported success (live verification is not proven, #53),
      and `unavailable` when the host/CLI is missing. Bounded to 1 task
      and the configured timeout.
    default: 'false'
    required: false
  approval-token:
    description: >-
      Optional token that lets Argus submit a *formal* pull request review, which
      is what `require_approving_reviews` reads. `github.token` cannot be used:
      GitHub refuses it with 422 "GitHub Actions is not permitted to approve
      pull requests", and no permission scope changes that. Supply a GitHub App
      installation token, or a PAT belonging to an account that is not the PR
      author. Empty (the default) keeps Argus to the sticky comment only. See
      docs/approval-token.md.
    default: ''
    required: false
  approval-evidence:
    description: >-
      The test command(s) an approval stands on, cited verbatim in the review
      body, e.g. 'python -m unittest discover -s tests && ruff check .'.
      Required whenever approval-token is supplied: the lane refuses to submit
      an approval that cites no command, so an approver is always re-runnable.
      Ignored when approval-token is empty.
    default: ''
    required: false
  approval-check:
    description: >-
      Name of a check run that must have completed successfully on the head
      commit before Argus will submit an APPROVE, e.g. 'test (22)' or 'lint'.
      This is what makes the cited test command evidence rather than a claim:
      the review cites the real run. An APPROVE with no green run of this name
      is refused. Ignored on the REQUEST_CHANGES and COMMENT paths, so a
      negative review still goes out while CI is red.
    default: ''
    required: false
  approval-check-app:
    description: >-
      App slug that is allowed to produce the approval-check run, e.g.
      'github-actions'. A check name is not a producer: a fork can add a
      workflow that reports a green run with the expected name, so the match is
      pinned to one App. Set this to your own App slug if your CI is not GitHub
      Actions. Empty accepts any producer and is not the default.
    default: 'github-actions'
    required: false
  emit-review:
    description: >-
      Submit the formal review when `approval-token` is supplied. 'false' keeps
      the token out of the review lane entirely. A `true` value without a token
      is a no-op, not an error.
    default: 'true'
    required: false
outputs:
  conclusion:
    description: 'Run conclusion: success, failure, or neutral'
    value: ${{ steps.post.outputs.conclusion }}
  review-event:
    description: 'GitHub review event submitted: APPROVE, REQUEST_CHANGES, COMMENT, or none'
    value: ${{ steps.approve.outputs.review-event }}
  review-state:
    description: 'State of the submitted review, or why none was submitted'
    value: ${{ steps.approve.outputs.review-state }}
  stale-dismissed:
    description: 'Stale approvals by this identity that were dismissed because they no longer describe the head. "unknown" if the existing reviews could not be read.'
    value: ${{ steps.approve.outputs.stale-dismissed }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Prepare pinned Argus runtime
      id: bootstrap
      shell: bash
      env:
        ARGUS_ACTION_PATH: ${{ github.action_path }}
        ARGUS_CLI: ${{ inputs.cli }}
        ARGUS_ARGUS_VERSION: ${{ inputs.argus-version }}
        ARGUS_CONFIG_PATH: ${{ inputs.config }}
        ARGUS_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        ARGUS_REPORT_DIR: ${{ inputs.report-dir }}
        ARGUS_BROWSER: ${{ inputs.browser }}
        ARGUS_BUDGET_USD: ${{ inputs.budget-usd }}
        ARGUS_MAX_COMMENTS: ${{ inputs.max-comments }}
        ARGUS_CODE_MODEL: ${{ inputs.code-model }}
        ARGUS_REVIEW_PROFILES: ${{ inputs.review-profiles }}
      run: node "$ARGUS_ACTION_PATH/bootstrap.mjs"

    - name: Reject executable lanes on untrusted pull requests
      if: >-
        inputs.run != 'false' || inputs.app == 'true' || inputs.a0 == 'true'
        || inputs.install-consumer-dependencies == 'true'
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_FORK: ${{ github.event.pull_request.head.repo.fork }}
      run: |
        # Each refusal says what happened and what to do, in the log and in
        # the job summary, because no PR comment is posted on this path.
        refuse() {
          echo "$1" >&2
          {
            echo '### Argus: ⊖ blocked'
            echo
            echo "**Runtime lanes refused:** $1"
            echo
            echo "Fix: $2"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        }
        REVIEW_ONLY="set run: 'false' and leave app, a0 and install-consumer-dependencies off; the code review lane still runs."
        if [ "$EVENT_NAME" = "pull_request_target" ]; then
          refuse "Argus runtime lanes do not run on pull_request_target, which carries write credentials beside PR code." \
            "use the pull_request event for runtime lanes, or $REVIEW_ONLY"
        fi
        if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_FORK" != "false" ]; then
          refuse "this pull request comes from a fork, and runtime lanes execute PR code, so they need a same-repository PR or an explicitly trusted workflow." \
            "for fork pull requests, $REVIEW_ONLY"
        fi
        if [ "$EVENT_NAME" = "issue_comment" ]; then
          # issue_comment checks out the BASE ref, never the PR head;
          # consumer deps on the base tree are trusted. The replay `run`
          # lane is still meaningless here (it would test the base app
          # against a head diff); @argus record covers that case.
          if [ "${{ inputs.run }}" != "false" ]; then
            refuse "the run lane is disabled on issue_comment, which checks out the base branch, not the PR head." \
              "comment '@argus record' on the pull request instead."
          fi
          if [ "${{ inputs.app }}" = "true" ] || [ "${{ inputs.a0 }}" = "true" ]; then
            refuse "the app and a0 lanes are disabled on issue_comment; they verify a checkout of the PR head." \
              "run those lanes from a pull_request workflow."
          fi
          exit 0
        fi
        if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "" ]; then
          refuse "runtime lanes do not run on the $EVENT_NAME event, which is not on the trusted list." \
            "run them from a pull_request workflow, or $REVIEW_ONLY"
        fi

    - name: Install consumer dependencies for explicit runtime lanes
      if: inputs.install-consumer-dependencies == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      run: npm ci

    - name: Install Playwright browser for explicit runtime lanes
      if: inputs.run != 'false' || inputs.app == 'true' || (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'record'))
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        ARGUS_BROWSER: ${{ inputs.browser }}
      run: |
        npx playwright install --with-deps "$ARGUS_BROWSER" || npx playwright install "$ARGUS_BROWSER"

    - name: Build repo index
      if: inputs.index == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        ARGUS_ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ github.token }}
        ARGUS_CLI_JSON: ${{ steps.bootstrap.outputs.cli-json }}
        ARGUS_WORKING_DIRECTORY: ${{ steps.bootstrap.outputs.working-directory }}
      run: node "$ARGUS_ACTION_PATH/cli.mjs" index

    - name: Dispatch @argus mention
      # issue_comment runs never check out the PR head; the workflow
      # checks out the base ref and `mention` dispatches whitelisted
      # commands (review/record/persist/help). Results still land in the
      # report dir for the sticky post step below.
      if: github.event_name == 'issue_comment'
      id: mention
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        ARGUS_ACTION_PATH: ${{ github.action_path }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        GITHUB_TOKEN: ${{ github.token }}
        ARGUS_CLI_JSON: ${{ steps.bootstrap.outputs.cli-json }}
        ARGUS_WORKING_DIRECTORY: ${{ steps.bootstrap.outputs.working-directory }}
        ARGUS_REPORT_DIR: ${{ inputs.report-dir }}
        ARGUS_BUDGET_USD: ${{ inputs.budget-usd }}
        ARGUS_MAX_COMMENTS: ${{ inputs.max-comments }}
        ARGUS_CODE_MODEL: ${{ inputs.code-model }}
        ARGUS_REVIEW_PROFILES: ${{ inputs.review-profiles }}
        ARGUS_DEBUG: '1'
        ARGUS_REVIEWER_TRACE: >-
          {"repo":"${{ github.repository }}",
          "pr":"${{ github.event.issue.number }}",
          "commit":"${{ github.sha }}",
          "run_id":"${{ github.run_id }}",
          "run_attempt":"${{ github.run_attempt }}",
          "workflow":"${{ github.workflow }}"}
      run: node "$ARGUS_ACTION_PATH/cli.mjs" mention --report-dir "$ARGUS_REPORT_DIR"

    - name: Run selected Argus lanes
      if: github.event_name != 'issue_comment'
      id: verify
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      continue-on-error: true
      env:
        ARGUS_ACTION_PATH: ${{ github.action_path }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        GITHUB_TOKEN: ${{ github.token }}
        ARGUS_CLI_JSON: ${{ steps.bootstrap.outputs.cli-json }}
        ARGUS_WORKING_DIRECTORY: ${{ steps.bootstrap.outputs.working-directory }}
        ARGUS_REPORT_DIR: ${{ inputs.report-dir }}
        ARGUS_VERIFY_FLOW: ${{ inputs.run != 'false' && '1' || '' }}
        ARGUS_VERIFY_APP: ${{ inputs.app == 'true' && '1' || '' }}
        ARGUS_VERIFY_A0: ${{ inputs.a0 == 'true' && '1' || '' }}
        ARGUS_VERIFY_URL: ${{ inputs.app-url }}
        ARGUS_VERIFY_TASK: ${{ inputs.app-task }}
        ARGUS_VERIFY_EXPECT_TEXT: ${{ inputs.app-expect-text }}
        ARGUS_VERIFY_EXPECT_URL: ${{ inputs.app-expect-url }}
        ARGUS_VERIFY_EXPECT_SELECTOR: ${{ inputs.app-expect-selector }}
        ARGUS_SANDBOX: ${{ inputs.sandbox == 'true' && '1' || '' }}
        ARGUS_MAX_COMMENTS: ${{ inputs.max-comments }}
        ARGUS_DEBUG: '1'
        ARGUS_DIFF_BASE: ${{ inputs.diff-base }}
        ARGUS_BUDGET_USD: ${{ inputs.budget-usd }}
        ARGUS_CODE_MODEL: ${{ inputs.code-model }}
        ARGUS_REVIEW_PROFILES: ${{ inputs.review-profiles }}
        ARGUS_REVIEWER_TRACE: >-
          {"repo":"${{ github.repository }}",
          "pr":"${{ github.event.pull_request.number }}",
          "commit":"${{ github.event.pull_request.head.sha || github.sha }}",
          "run_id":"${{ github.run_id }}",
          "run_attempt":"${{ github.run_attempt }}",
          "workflow":"${{ github.workflow }}"}
      run: node "$ARGUS_ACTION_PATH/cli.mjs" verify --report-dir "$ARGUS_REPORT_DIR"

    - name: Post or update sticky PR comment
      id: post
      if: always()
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        ARGUS_ACTION_PATH: ${{ github.action_path }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        VISION_E2E_WORKING_DIR: ${{ inputs.working-directory }}
        ARGUS_REPORT_DIR: ${{ inputs.report-dir }}
        ARGUS_RUN_DISABLED: ${{ inputs.run == 'false' && '1' || '' }}
      with:
        github-token: ${{ github.token }}
        script: |
          const path = require('path');
          const actionPath = process.env.ARGUS_ACTION_PATH;
          const { run } = require(path.join(actionPath, 'sticky-comment.cjs'));
          return await run({ github, context, core });

    - name: Submit formal approval review
      id: approve
      if: always() && inputs.emit-review != 'false'
      shell: bash
      env:
        ARGUS_APPROVAL_TOKEN: ${{ inputs.approval-token }}
        ARGUS_APPROVAL_EVIDENCE: ${{ inputs.approval-evidence }}
        ARGUS_APPROVAL_CHECK: ${{ inputs.approval-check }}
        ARGUS_APPROVAL_CHECK_APP: ${{ inputs.approval-check-app }}
        ARGUS_REPORT_DIR: ${{ inputs.report-dir }}
        VISION_E2E_WORKING_DIR: ${{ inputs.working-directory }}
        ARGUS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: node "${{ github.action_path }}/emit-review.mjs"
