name: argus-reviewer
description: Run the argus-reviewer harness and post a sticky PR comment with cost and evidence.
author: duketopceo
inputs:
  openrouter-api-key:
    description: OpenRouter API key (BYOK). All vision calls are billed through this key.
    required: true
  argus-version:
    description: Optional pinned argus-reviewer-e2e npm version. Empty installs the CLI package from this action ref with lifecycle scripts disabled.
    default: ''
    required: false
  cli:
    description: Optional executable plus arguments for a trusted local CLI override. Shell operators are rejected; empty installs the CLI package from this action ref.
    default: ''
    required: false
  config:
    description: Path to the argus-reviewer config file
    default: argus-reviewer.config.ts
    required: false
  working-directory:
    description: Working directory for the consumer's project
    required: false
  budget-usd:
    description: Optional per-run budget cap override in USD
    required: false
  index:
    description: Run `argus-reviewer index` before the test run to enable diff-aware cache invalidation
    default: 'true'
    required: false
  diff-base:
    description: Base ref for diff invalidation (e.g. origin/main); empty = working tree
    default: ''
    required: false
  node-version:
    description: Node.js version for the harness (Node 20 is deprecated on GH runners)
    default: '22'
    required: false
  browser:
    description: Playwright browser engine to install and run (chromium, firefox, or webkit). Should match config.browser.
    default: 'chromium'
    required: false
  report-dir:
    description: Report output dir, passed to both run and code-review so the post step can find artifacts
    default: argus-reviewer-report
    required: false
  sandbox:
    description: Enable the B.2 probe lane — authored test probes for unexercised findings run in a hardened Docker container (no network, no secrets, read-only fs). Enable-only — 'false' does not override a config-enabled lane. Requires Docker on the runner; forced off on pull_request_target.
    default: 'false'
    required: false
  max-comments:
    description: Cap on inline review comments posted per run; overflow is summarized in the sticky. Overrides review.maxComments when set.
    default: ''
    required: false
  install-consumer-dependencies:
    description: Explicitly install the consumer project's dependencies for a trusted runtime lane. Disabled by default so code review never runs PR-controlled lifecycle scripts beside secrets.
    default: 'false'
    required: false
  run:
    description: Run the browser-flow lane (`argus-reviewer run`). Disabled by default for public code-review-only repositories. Requires an explicit target and a trusted runtime path.
    default: 'false'
    required: false
outputs:
  conclusion:
    description: 'Run conclusion: success, failure, or neutral'
    value: ${{ steps.post.outputs.conclusion }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Prepare pinned Argus runtime
      id: bootstrap
      shell: bash
      env:
        ARGUS_ACTION_PATH: ${{ github.action_path }}
        ARGUS_CLI: ${{ inputs.cli }}
        ARGUS_ARGUS_VERSION: ${{ inputs.argus-version }}
        ARGUS_CONFIG_PATH: ${{ inputs.config }}
        ARGUS_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        ARGUS_REPORT_DIR: ${{ inputs.report-dir }}
        ARGUS_BROWSER: ${{ inputs.browser }}
        ARGUS_BUDGET_USD: ${{ inputs.budget-usd }}
        ARGUS_MAX_COMMENTS: ${{ inputs.max-comments }}
      run: node "$ARGUS_ACTION_PATH/bootstrap.mjs"

    - name: Reject executable lanes on untrusted pull requests
      if: inputs.run != 'false' || inputs.install-consumer-dependencies == 'true'
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_FORK: ${{ github.event.pull_request.head.repo.fork }}
      run: |
        if [ "$EVENT_NAME" = "pull_request_target" ]; then
          echo "Argus runtime lanes are disabled for pull_request_target." >&2
          exit 1
        fi
        if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_FORK" != "false" ]; then
          echo "Argus runtime lanes require a same-repository PR or an explicitly trusted workflow." >&2
          exit 1
        fi
        if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "" ]; then
          echo "Argus runtime lanes are disabled for unlisted CI events: $EVENT_NAME" >&2
          exit 1
        fi

    - name: Install consumer dependencies for explicit runtime lanes
      if: inputs.install-consumer-dependencies == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      run: npm ci

    - name: Install Playwright browser for explicit runtime lanes
      if: inputs.run != 'false'
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        ARGUS_BROWSER: ${{ inputs.browser }}
      run: |
        npx playwright install --with-deps "$ARGUS_BROWSER" || npx playwright install "$ARGUS_BROWSER"

    - name: Build repo index
      if: inputs.index == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        ARGUS_ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ github.token }}
        ARGUS_CLI_JSON: ${{ steps.bootstrap.outputs.cli-json }}
        ARGUS_WORKING_DIRECTORY: ${{ steps.bootstrap.outputs.working-directory }}
      run: node "$ARGUS_ACTION_PATH/cli.mjs" index

    - name: Run selected Argus lanes
      id: verify
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      continue-on-error: true
      env:
        ARGUS_ACTION_PATH: ${{ github.action_path }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        GITHUB_TOKEN: ${{ github.token }}
        ARGUS_CLI_JSON: ${{ steps.bootstrap.outputs.cli-json }}
        ARGUS_WORKING_DIRECTORY: ${{ steps.bootstrap.outputs.working-directory }}
        ARGUS_REPORT_DIR: ${{ inputs.report-dir }}
        ARGUS_VERIFY_FLOW: ${{ inputs.run != 'false' && '1' || '' }}
        ARGUS_SANDBOX: ${{ inputs.sandbox == 'true' && '1' || '' }}
        ARGUS_MAX_COMMENTS: ${{ inputs.max-comments }}
        ARGUS_DEBUG: '1'
        ARGUS_DIFF_BASE: ${{ inputs.diff-base }}
        ARGUS_BUDGET_USD: ${{ inputs.budget-usd }}
        ARGUS_REVIEWER_TRACE: >-
          {"repo":"${{ github.repository }}",
          "pr":"${{ github.event.pull_request.number }}",
          "commit":"${{ github.event.pull_request.head.sha || github.sha }}",
          "run_id":"${{ github.run_id }}",
          "run_attempt":"${{ github.run_attempt }}",
          "workflow":"${{ github.workflow }}"}
      run: node "$ARGUS_ACTION_PATH/cli.mjs" verify --report-dir "$ARGUS_REPORT_DIR"

    - name: Post or update sticky PR comment
      id: post
      if: always()
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        ARGUS_ACTION_PATH: ${{ github.action_path }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        VISION_E2E_WORKING_DIR: ${{ inputs.working-directory }}
        ARGUS_REPORT_DIR: ${{ inputs.report-dir }}
        ARGUS_RUN_DISABLED: ${{ inputs.run == 'false' && '1' || '' }}
      with:
        github-token: ${{ github.token }}
        script: |
          const path = require('path');
          const actionPath = process.env.ARGUS_ACTION_PATH;
          const { run } = require(path.join(actionPath, 'sticky-comment.cjs'));
          return await run({ github, context, core });
