name = "argus-app-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# No public URL until you add a route (or set workers_dev = true).
# See docs/self-host-app.md. Example, on a zone in your own account:
#   routes = [{ pattern = "argus.example.com/webhook", zone_name = "example.com" }]
workers_dev = false
preview_urls = false

[observability]
enabled = false

# Secrets (set with `wrangler secret put <NAME>`, never in this file):
#   WEBHOOK_SECRET  GitHub App webhook secret
#   APP_ID          GitHub App numeric ID
#   PRIVATE_KEY     App private key (PKCS#8 or GitHub's PKCS#1 PEM)
# There is deliberately no OPENROUTER_* binding: the Worker never holds a model key.
