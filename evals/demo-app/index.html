<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Field Notes Shop</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #0e1116; }
  body.dark { background: #14171c; color: #e8eaed; }
  header { padding: 16px 40px; background: #fff; border-bottom: 1px solid #d3d8df; font-weight: 600; font-size: 20px; }
  body.dark header { background: #1c2027; border-color: #2d333c; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 32px 40px; }
  section { background: #fff; border: 1px solid #d3d8df; border-radius: 8px; padding: 20px; }
  body.dark section { background: #1c2027; border-color: #2d333c; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  p { margin: 8px 0; }
  .state { color: #3a414c; min-height: 22px; }
  body.dark .state { color: #aab1bc; }
  button { padding: 10px 18px; font-size: 16px; background: #2343f5; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  input[type=text], input[type=email] { padding: 9px 10px; font-size: 16px; width: 100%; max-width: 280px; margin: 4px 0 10px; border: 1px solid #aab1bc; border-radius: 4px; display: block; }
  label { display: block; font-size: 14px; }
</style>
</head>
<body>
<header>Field Notes Shop</header>
<main>
  <section>
    <h2>Product</h2>
    <p>Field notebook, $12.00</p>
    <button id="add" type="button">Add to cart</button>
    <p class="state" id="cart">Cart: 0 items</p>
    <label><input id="gift" type="checkbox" aria-label="Gift wrap"> Gift wrap</label>
    <p class="state" id="giftstate">Gift wrap: off</p>
    <button id="order" type="button">Place order</button>
    <p class="state" id="orderstate"></p>
  </section>
  <section>
    <h2>Shipping</h2>
    <label for="name">Name</label>
    <input id="name" type="text" aria-label="Name" autocomplete="off">
    <label for="address">Address</label>
    <input id="address" type="text" aria-label="Address" autocomplete="off">
    <button id="save" type="button">Save address</button>
    <p class="state" id="shipstate"></p>
  </section>
  <section>
    <h2>Newsletter</h2>
    <label for="email">Email</label>
    <input id="email" type="email" aria-label="Email" autocomplete="off">
    <button id="subscribe" type="button">Subscribe</button>
    <p class="state" id="substate"></p>
  </section>
  <section>
    <h2>Display</h2>
    <button id="theme" type="button">Dark mode</button>
    <p class="state" id="themestate">Theme: light</p>
  </section>
</main>
<script src="/shared.js"></script>
</body>
</html>
